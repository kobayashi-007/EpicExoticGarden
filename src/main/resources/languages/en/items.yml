# Content written into generated config files (comments etc.; plain text, no color codes)
# recipe/*.yml header ({0}=file name, {1}=group description)
_file_recipe_header: |-
  # =====================================================================
  # EpicExoticGarden recipe configuration - {0} ({1})
  #
  # Field reference:
  #   hunger      Hunger restored (0-20); applies instantly on /epicgarden reload
  #   enabled     true to register the recipe, false to disable
  #   amount      How many of the result item the recipe produces
  #   type        SHAPELESS = ingredients in any order
  #               SHAPED    = fixed pattern (see pattern field below)
  #   ingredients Custom items by ID (e.g. BUTTER, GRAPE_JUICE),
  #               vanilla items by material (e.g. SUGAR, COOKED_BEEF),
  #               repeat suffix :count (e.g. DIRT_ESSENCE:8)
  #   pattern     Shaped recipe grid (up to 3 rows, up to 3 chars each; space = empty slot)
  #
  # Changes to crafting recipes require a server restart to take effect.
  # Make sure every ingredient still exists in the current version.
  # =====================================================================
_file_recipe_empty_hint: "Add enabled / amount / type / ingredients to define the recipe"
_file_recipe_disabled: "[auto-disabled: result item cannot be resolved]"
_file_recipe_appended_header: "New content (appended automatically after a plugin update)"
_file_recipe_no_recipe: "No crafting recipe by default (obtained via grass drops / planting / harvesting; add below if desired)"
# Recipe group descriptions (used for {1} in the header)
_file_group_plants: "Plants / Bushes / Saplings"
_file_group_fruits: "Fruits / Crops"
_file_group_ingredients: "Ingredients / Seasonings"
_file_group_tools: "Tools"
_file_group_dishes: "Dishes"
_file_group_drinks: "Drinks"
_file_group_magicalcrops: "Magical Crops"
# models.yml header
_file_models_header: |-
  # =====================================================================
  # EpicExoticGarden CustomModelData configuration
  #
  # Assign a CustomModelData value to an item so a resource pack can show custom art:
  #   ITEM_ID: 10001   -> applies CustomModelData = 10001
  #   ITEM_ID: 0       -> unchanged (default, vanilla appearance)
  #
  # Notes:
  #   - Requires server version 1.14+; older versions ignore this file
  #   - The "Material" comment after each entry is the item's vanilla base material;
  #     target it with overrides in your resource pack
  #   - Head items (berries/fruits etc.) get their item-form art from the skin;
  #     CustomModelData generally only affects their placed block form
  #   - Run /eeg reload to apply changes; items already in inventories stay unchanged
  # =====================================================================
_file_models_material: "Material"
_file_models_appended_header: "New items (appended automatically after a plugin update)"
_file_models_cat_plants_and_fruits: "Plants & Fruits"
_file_models_cat_misc: "Ingredients & Tools"
_file_models_cat_food: "Dishes"
_file_models_cat_drinks: "Drinks"
_file_models_cat_magical: "Magical Crops"

