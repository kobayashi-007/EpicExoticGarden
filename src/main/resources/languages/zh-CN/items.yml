# 生成的配置文件内容（注释等，纯文本，不支持颜色代码）
# recipe/*.yml 的说明头（{0}=文件名，{1}=分组描述）
_file_recipe_header: |-
  # =====================================================================
  # EpicExoticGarden 配方配置 - {0}（{1}）
  #
  # 字段说明：
  #   hunger      食用后回复的饱食度（0-20），可在游戏内 /epicgarden reload 即时生效
  #   enabled     是否启用该合成配方（false 禁用）
  #   amount      合成产出数量
  #   type        SHAPELESS=无序合成（材料任意摆放）/ SHAPED=有序合成（形状固定）
  #   ingredients 材料：本插件物品写 ID（如 BUTTER、GRAPE_JUICE），
  #               原版物品写材质名（如 SUGAR、COOKED_BEEF），
  #               数量后缀 :数字（如 DIRT_ESSENCE:8）
  #   pattern     有序合成的摆放形状（最多 3 行、每行最多 3 字符，空格为空位）
  #
  # 修改合成配方后需要重启服务器；新增/删除材料请确保对应物品在当前版本存在。
  # =====================================================================
_file_recipe_empty_hint: "可添加 enabled / amount / type / ingredients 来定义配方"
_file_recipe_disabled: "[自动停用：结果物品无法解析]"
_file_recipe_appended_header: "新增内容（插件更新后自动追加）"
_file_recipe_no_recipe: "默认无合成配方（打草丛/种植/收获获得，也可按下面格式自行添加）"
