_file_group_drinks: "饮品"
_file_group_magicalcrops: "魔法作物"
# models.yml 说明头
_file_models_header: |-
  # =====================================================================
  # EpicExoticGarden 自定义模型数据（CustomModelData）配置
  #
  # 为物品设置 CustomModelData 数值，配合资源包显示自定义贴图/模型：
  #   物品ID: 10001   → 应用 CustomModelData = 10001
  #   物品ID: 0       → 不修改（默认，保持原版外观）
  #
  # 说明：
  #   - 需要 1.14 及以上版本；低版本自动忽略本文件
  #   - 每行末尾的「材质」注释是该物品的原版基础材质，资源包里给它配置 overrides 即可
  #   - 头颅物品（浆果/水果等）的物品形态贴图由皮肤决定，CustomModelData 一般只影响其方块形态
  #   - 修改后执行 /eeg reload 立即生效；玩家背包中已有的旧物品不会更新，重新获取即可
  # =====================================================================
_file_models_material: "材质"
_file_models_appended_header: "新增物品（插件更新后自动追加）"
